name: source

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

permissions:
  contents: read

concurrency:
  group: source-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: source-tests
        env:
          GOMAXPROCS: "2"
          GOFLAGS: -p=1
        run: go test ./api/... ./controllers -short -count=1
