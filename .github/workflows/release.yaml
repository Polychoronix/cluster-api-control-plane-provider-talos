# Unlike ci.yaml, this file is not generated by kres: the upstream pipeline targets Sidero
# Labs' self-hosted runner group, which this fork has no access to.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
"on":
  push:
    tags:
      - v*
name: release
permissions:
  contents: write
  packages: write
env:
  REGISTRY: ghcr.io
  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
  REVISION: ${{ github.sha }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set-image-namespace
        shell: bash
        run: echo "USERNAME=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: setup-qemu
        uses: docker/setup-qemu-action@v4
      - name: setup-buildx
        uses: docker/setup-buildx-action@v4
      - name: login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: container
        run: |
          make container \
            PUSH=true \
            PLATFORM=linux/amd64,linux/arm64 \
            TAG="$GITHUB_REF_NAME"
      - name: release-manifests
        run: |
          make manifests \
            PLATFORM=linux/amd64 \
            TAG="$GITHUB_REF_NAME"
          make local-release \
            DEST=./_out \
            PLATFORM=linux/amd64 \
            TAG="$GITHUB_REF_NAME"
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: _out/control-plane-talos/${{ github.ref_name }}/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
