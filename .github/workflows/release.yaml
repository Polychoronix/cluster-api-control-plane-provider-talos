# Unlike ci.yaml, this file is not generated by kres: the upstream pipeline targets Sidero
# Labs' self-hosted runner group, which this fork has no access to.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
"on":
  push:
    tags:
      - v*
name: release
permissions:
  contents: write
  packages: write
env:
  REGISTRY: ghcr.io
  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set-image-namespace
        shell: bash
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          image="${REGISTRY}/$owner/cluster-api-control-plane-talos-controller:$GITHUB_REF_NAME"
          revision=$(git rev-parse HEAD)
          printf 'USERNAME=%s\nCONTROLLER_IMAGE=%s\nREVISION=%s\n' "$owner" "$image" "$revision" >> "$GITHUB_ENV"
      - name: setup-qemu
        uses: docker/setup-qemu-action@v4
      - name: setup-buildx
        uses: docker/setup-buildx-action@v4
      - name: login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: container
        run: |
          make container \
            PUSH=true \
            PLATFORM=linux/amd64,linux/arm64 \
            TAG="$GITHUB_REF_NAME" \
            USERNAME="$USERNAME" \
            CONTROLLER_IMAGE="$CONTROLLER_IMAGE" \
            BUILD_METADATA=_out/image-metadata.json \
            SOURCE_URL="$SOURCE_URL" \
            REVISION="$REVISION"
      - name: published-image
        id: published
        run: |
          digest=$(jq -er '."containerimage.digest" | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' _out/image-metadata.json)
          printf 'image=%s@%s\n' "${CONTROLLER_IMAGE%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - name: release-manifests
        run: |
          make manifests \
            PLATFORM=linux/amd64 \
            TAG="$GITHUB_REF_NAME"
          make local-release \
            DEST=./_out \
            PLATFORM=linux/amd64 \
            TAG="$GITHUB_REF_NAME" \
            CONTROLLER_IMAGE="${{ steps.published.outputs.image }}" \
            SOURCE_URL="$SOURCE_URL" \
            REVISION="$REVISION"
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: _out/control-plane-talos/${{ github.ref_name }}/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
